<style>
:root{--bg:#050608;--card:#0d1118;--line:#1b2433;--fg:#f2f4f8;--muted:#9aa4b5;--blue:#1f6bff;--blue-hi:#4d8dff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{position:relative;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.ig,.tag,.price,.mark,.drawer a.l{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-weight:400;margin:0}
a:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ig{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:16px 20px;border-radius:999px;background:var(--blue);color:#fff;text-decoration:none;font-size:28px;letter-spacing:.08em;box-shadow:0 8px 32px rgba(31,107,255,.45);transition:background .2s,transform .2s}
.ig:hover{background:var(--blue-hi)}.ig:active{transform:scale(.98)}
.ig svg{width:28px;height:28px;flex:none}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;z-index:20}
.bar.home{position:absolute;top:0;left:0;right:0;justify-content:flex-end}
.bar.sub{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(5,6,8,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.mark{display:inline-flex;align-items:center;gap:6px;padding:10px 16px 10px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--fg);text-decoration:none;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;letter-spacing:.08em;line-height:1;transition:background .2s,transform .2s}.mark:hover{background:rgba(255,255,255,.14)}.mark:active{transform:scale(.97)}.mark svg{flex:none}
.burger,.close{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:rgba(13,17,24,.7);color:var(--fg);cursor:pointer;padding:0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(74vw,290px);background:rgba(13,17,24,.86);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-left:1px solid var(--line);transform:translateX(100%);visibility:hidden;transition:transform .25s,visibility .25s;z-index:40;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);gap:4px}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.dlogo{display:block;border-radius:50%}.dlogo img{display:block;width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px var(--blue)}
.drawer a.l{display:flex;align-items:center;justify-content:space-between;padding:14px 14px;border-radius:12px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:18px;font-weight:600;letter-spacing:.01em;color:var(--fg);text-decoration:none;transition:background .2s}.drawer a.l::after{content:'\203A';font-size:24px;line-height:1;opacity:.4}.drawer a.l:hover{background:rgba(255,255,255,.06)}
.drawer a.l[aria-current]{background:rgba(31,107,255,.18);color:#fff}.drawer a.l[aria-current]::after{color:var(--blue-hi);opacity:1}
.drawer .ig{margin-top:auto;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;letter-spacing:0;padding:13px 16px;gap:10px;box-shadow:none}.drawer .ig svg{width:20px;height:20px}
.open .scrim{opacity:1;pointer-events:auto}
.open .drawer{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
main{max-width:720px;margin:0 auto;padding:32px 16px 56px}
h1{font-size:52px;letter-spacing:.06em;margin-bottom:20px}
.lead{font-family:"Bebas Neue",Impact,sans-serif;font-size:34px;line-height:1.1;letter-spacing:.04em;margin:0 0 20px;padding-left:16px;border-left:4px solid var(--blue)}
.story p{font-size:17px;line-height:1.65;color:#d5dbe6;margin:0 0 16px}
.story a{color:var(--blue-hi)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid>*,.ph{width:100%;display:block;object-fit:cover;border-radius:14px;background:var(--card)}
.wide{grid-column:span 2}.v{aspect-ratio:16/9}.p{aspect-ratio:3/4}.ph{aspect-ratio:4/5;margin-top:24px}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.item img{width:100%;aspect-ratio:1;object-fit:contain}.item img.r{border-radius:50%}
.item h3{font-size:22px;letter-spacing:.06em}.item small{color:var(--muted);font-size:13px}
.buy{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.price{font-size:28px;color:var(--blue-hi)}
.buy a{color:#fff;background:var(--blue);text-decoration:none;font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px}
.note{color:var(--muted);font-size:14px;line-height:1.5;margin:16px 0 0}
</style>
</head>
